[project]
name = "idv-apskaita-backend"
version = "0.1.0"
description = "Apskaitos sistema individualia veikla vykdantiems asmenims"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
    "django-q2>=1.7,<2",
    "weasyprint>=62",
    "openpyxl>=3.1,<4",
    "cryptography>=43",
    "whitenoise>=6.9",
    "gunicorn>=23",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.django-stubs]
django_settings_module = "config.settings"
