services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idv_apskaita}
      POSTGRES_USER: ${POSTGRES_USER:-idv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idv_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-idv_apskaita}
      POSTGRES_USER: ${POSTGRES_USER:-idv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idv_dev}
    depends_on:
      db:
        condition: service_healthy

  qcluster:
    build: ./backend
    command: ["python", "manage.py", "qcluster"]
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-idv_apskaita}
      POSTGRES_USER: ${POSTGRES_USER:-idv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idv_dev}
    depends_on:
      backend:
        condition: service_started

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  pgdata_dev:
  backend_venv:
  frontend_node_modules:
